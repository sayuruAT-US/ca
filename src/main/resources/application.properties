spring.application.name=transcript-processing-service
spring.profiles.active=local

server.port=8081

spring.kafka.consumer.group-id=transcript-processing-group
spring.kafka.consumer.auto-offset-reset=earliest

app.kafka.topic=${KAFKA_TOPIC:telephony.events}

# ── Role toggles (deploy one jar as WS / producer / consumer nodes) ──────────
# Each role is independently enable-able so the same artifact can run as a
# WS-ingestion node, an HTTP-producer node, and a consumer node (or all-in-one,
# the default). Flip these per node via env in each deployment.
#   app.ws.enabled       — Live-transcription WebSocket ingestion (PBXware -> Kafka)
#   app.producer.enabled — HTTP webhook endpoints (/events, /transcript) -> Kafka
#   app.consumer.enabled — Kafka @KafkaListener consumer -> DB
app.ws.enabled=${APP_WS_ENABLED:true}
app.producer.enabled=${APP_PRODUCER_ENABLED:true}
app.consumer.enabled=${APP_CONSUMER_ENABLED:true}

# WebSocket ingestion tuning (only used when app.ws.enabled=true).
# path matches the Node service (/transcript); PBXware is a server client, so
# allowed-origins defaults to * (not a browser CORS surface).
app.ws.path=${APP_WS_PATH:/transcript}
app.ws.allowed-origins=${APP_WS_ALLOWED_ORIGINS:*}
app.ws.ping-interval-ms=${APP_WS_PING_INTERVAL_MS:25000}

# Bicom PBXware webhook receiver (Java port of the Node /events endpoint).
# Optional shared secret; when blank the x-shared-secret header check is skipped,
# matching the Node default (EVENT_MANAGER_SHARED_SECRET unset).
app.webhook.shared-secret=${EVENT_MANAGER_SHARED_SECRET:}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Execute schema.sql automatically on startup for all databases
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

server.error.whitelabel.enabled=false


app.events.source=${APP_EVENTS_SOURCE:pbxware}
app.ari.enabled=${APP_ARI_ENABLED:false}
app.ari.host=${ARI_HOST:tst-pbx-01.snetcom.net}
app.ari.port=${ARI_PORT:443}
app.ari.ssl=${ARI_SSL:true}
app.ari.username=${ARI_USERNAME:at}
app.ari.password=${ARI_PASSWORD:}
app.ari.app-name=${ARI_APP_NAME:Sayuru-ubuntu}
app.ari.subscribe-all=${ARI_SUBSCRIBE_ALL:true}
app.ari.reconnect-delay-ms=${ARI_RECONNECT_DELAY_MS:5000}
app.ari.debug-topic-enabled=${ARI_DEBUG_TOPIC_ENABLED:false}
app.ari.debug-topic=${ARI_DEBUG_TOPIC:ari.events}