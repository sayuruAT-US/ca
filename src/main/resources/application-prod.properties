spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:prod-kafka.snet.internal:9092}

ciap.api.base-url=${CIAP_API_BASE_URL:https://ciap.snet.internal}

spring.datasource.url=${DB_URL:jdbc:postgresql://prod-postgres.snet.internal:5432/kafka_prod}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:prod_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.com.snet.transcriptprocessing=INFO
